name: Release Installer

'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-installer:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          startsWith(github.event.workflow_run.head_branch, 'v0.') ||
          startsWith(github.event.workflow_run.head_branch, 'v1.') ||
          startsWith(github.event.workflow_run.head_branch, 'v2.') ||
          startsWith(github.event.workflow_run.head_branch, 'v3.') ||
          startsWith(github.event.workflow_run.head_branch, 'v4.') ||
          startsWith(github.event.workflow_run.head_branch, 'v5.') ||
          startsWith(github.event.workflow_run.head_branch, 'v6.') ||
          startsWith(github.event.workflow_run.head_branch, 'v7.') ||
          startsWith(github.event.workflow_run.head_branch, 'v8.') ||
          startsWith(github.event.workflow_run.head_branch, 'v9.')
        )
      )
    runs-on: windows-latest
    steps:
      # actions/checkout@v4.2.2 (pinned commit SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@stable

      # actions/setup-node@v4.2.0 (pinned commit SHA)
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Installer (Setup EXE)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if ($env:RELEASE_BRANCH -ne 'main' -and $env:RELEASE_BRANCH -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
            throw "Refusing to build release for unsupported branch/tag: $($env:RELEASE_BRANCH)"
          }
          ./b.ps1 -Clean

      - name: Prepare Artifacts & Checksums
        id: artifact
        shell: pwsh
        run: |
          $bundleDir = "target/release/bundle/nsis"
          $setupExe = Get-ChildItem -Path $bundleDir -Filter "*.exe" | Select-Object -First 1
          if (-not $setupExe) { throw "Setup executable not found in $bundleDir" }

          $hash = (Get-FileHash -Algorithm SHA256 $setupExe.FullName).Hash.ToLowerInvariant()
          Set-Content -Path "$($setupExe.FullName).sha256" -Value "$hash  $($setupExe.Name)`n" -NoNewline

      # actions/upload-artifact@v4.6.2 (pinned commit SHA)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertex-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
            target/release/bundle/nsis/*.sig
            release/latest.json
          if-no-files-found: error

  sign-updates:
    needs: build-installer
    if: needs.build-installer.result == 'success'
    runs-on: windows-latest
    environment: update-signing
    steps:
      # Isolated signing job inside protected update-signing environment
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # actions/download-artifact@v4.3.0 (pinned commit SHA)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vertex-installer
          path: signed-assets

      - name: Sign Update Manifests
        shell: pwsh
        env:
          VERTEX_UPDATE_SIGNING_KEY_PEM: ${{ secrets.VERTEX_UPDATE_SIGNING_KEY_PEM }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          $signedRoot = (Resolve-Path signed-assets).Path
          Get-ChildItem -Path $signedRoot -File -Recurse | Where-Object { $_.DirectoryName -ne $signedRoot } | ForEach-Object {
            Move-Item -LiteralPath $_.FullName -Destination (Join-Path $signedRoot $_.Name) -Force
          }
          Get-ChildItem -Path $signedRoot -Directory | Remove-Item -Recurse -Force

          $tauriConf = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = [string]$tauriConf.version
          if ($env:RELEASE_BRANCH -match '^v[0-9]+\.[0-9]+\.[0-9]+' -and $env:RELEASE_BRANCH.Substring(1) -ne $version) {
            throw "Release tag/branch version ($($env:RELEASE_BRANCH)) must match tauri.conf.json version ($version)."
          }

          $installers = Get-ChildItem -Path signed-assets -Filter "*.exe"
          foreach ($installer in $installers) {
            ./scripts/Sign-UpdateManifest.ps1 -InstallerPath $installer.FullName -Version $version
          }

      # actions/upload-artifact@v4.6.2 (pinned commit SHA)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-update-assets
          path: signed-assets/*
          if-no-files-found: error

  release:
    needs: sign-updates
    if: needs.sign-updates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact@v4.3.0 (pinned commit SHA)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-update-assets
          path: release-assets

      - name: Publish Release
        run: |
          cat release-assets/*.sha256 > release-assets/checksums.txt || true
          if [[ "$RELEASE_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            printf "Release %s from commit \`%s\`.\n\n- \`Vertex\` Windows Setup Installer (NSIS)\n- Signed with ECDSA P-256 / SHA-256 for integrity verification.\n- SHA256 checksums and signed update manifests are attached.\n" "$RELEASE_BRANCH" "$HEAD_SHA" > release-notes.md
            gh release create "$RELEASE_BRANCH" release-assets/* \
              --title "Vertex $RELEASE_BRANCH" \
              --target "$HEAD_SHA" \
              --latest \
              --notes-file release-notes.md
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly" || true
            sleep 2
            printf "Automated build from commit \`%s\` on branch \`%s\`.\n\n- \`Vertex\` Windows Setup Installer (NSIS)\n- Signed with ECDSA P-256 / SHA-256 for integrity verification.\n- SHA256 checksums are attached for verification.\n" "$HEAD_SHA" "$RELEASE_BRANCH" > release-notes.md
            gh release create nightly release-assets/* \
              --title "Nightly build (latest main)" \
              --target "$HEAD_SHA" \
              --prerelease \
              --notes-file release-notes.md
          fi
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

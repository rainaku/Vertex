name: Release Installer

'on':
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-installer:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-latest
    steps:
      # actions/checkout@v4.2.2 (pinned commit SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@stable

      # actions/setup-node@v4.2.0 (pinned commit SHA)
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Installer (Setup EXE)
        shell: pwsh
        run: |
          ./b.ps1 -Clean

      - name: Prepare Artifacts & Checksums
        id: artifact
        shell: pwsh
        run: |
          $bundleDir = "target/release/bundle/nsis"
          $setupExe = Get-ChildItem -Path $bundleDir -Filter "*.exe" | Select-Object -First 1
          if (-not $setupExe) { throw "Setup executable not found in $bundleDir" }

          $hash = (Get-FileHash -Algorithm SHA256 $setupExe.FullName).Hash.ToLowerInvariant()
          Set-Content -Path "$($setupExe.FullName).sha256" -Value "$hash  $($setupExe.Name)`n" -NoNewline

          "name=$($setupExe.Name)" >> $env:GITHUB_OUTPUT
          "path=$($setupExe.FullName)" >> $env:GITHUB_OUTPUT

      # actions/upload-artifact@v4.6.2 (pinned commit SHA)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertex-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          if-no-files-found: error

  sign-updates:
    needs: build-installer
    if: needs.build-installer.result == 'success'
    runs-on: windows-latest
    environment: update-signing
    steps:
      # Isolated signing job inside protected update-signing environment
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # actions/download-artifact@v4.3.0 (pinned commit SHA)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vertex-installer
          path: signed-assets

      - name: Sign Update Manifests
        shell: pwsh
        env:
          VERTEX_UPDATE_SIGNING_KEY_PEM: ${{ secrets.VERTEX_UPDATE_SIGNING_KEY_PEM }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          $tauriConf = Get-Content "crates/app/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = [string]$tauriConf.version
          if ($env:RELEASE_BRANCH.StartsWith('v') -and $env:RELEASE_BRANCH.Substring(1) -ne $version) {
            throw "Release tag/branch version ($($env:RELEASE_BRANCH)) must match tauri.conf.json version ($version)."
          }

          $installers = Get-ChildItem -Path signed-assets -Filter "*.exe"
          foreach ($installer in $installers) {
            ./scripts/Sign-UpdateManifest.ps1 -InstallerPath $installer.FullName -Version $version
          }

      # actions/upload-artifact@v4.6.2 (pinned commit SHA)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-update-assets
          path: signed-assets/*
          if-no-files-found: error

  release:
    needs: sign-updates
    if: needs.sign-updates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact@v4.3.0 (pinned commit SHA)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-update-assets
          path: release-assets

      - name: Publish Release
        run: |
          cat release-assets/*.sha256 > release-assets/checksums.txt || true
          if [ "${{ startsWith(github.event.workflow_run.head_branch, 'v') }}" = "true" ]; then
            printf "Release %s from commit \`%s\`.\n\n- \`Vertex\` Windows Setup Installer (NSIS)\n- Signed with ECDSA P-256 / SHA-256 for integrity verification.\n- SHA256 checksums and signed update manifests are attached.\n" "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}" > release-notes.md
            gh release create "${{ github.event.workflow_run.head_branch }}" release-assets/* \
              --title "Vertex ${{ github.event.workflow_run.head_branch }}" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --latest \
              --notes-file release-notes.md
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/nightly || true
            sleep 2
            printf "Automated build from commit \`%s\` on branch \`%s\`.\n\n- \`Vertex\` Windows Setup Installer (NSIS)\n- Signed with ECDSA P-256 / SHA-256 for integrity verification.\n- SHA256 checksums are attached for verification.\n" "${{ github.event.workflow_run.head_sha }}" "${{ github.event.workflow_run.head_branch }}" > release-notes.md
            gh release create nightly release-assets/* \
              --title "Nightly build (latest main)" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --prerelease \
              --notes-file release-notes.md
          fi
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

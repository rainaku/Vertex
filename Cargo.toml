[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
]

[workspace.package]
version = "1.2.1"
edition = "2021"
authors = ["rainaku"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
infer = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff", "gif", "rayon"] }
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"
window-vibrancy = "0.5"
tauri = { version = "2.2", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "2.0" }
tauri-plugin-opener = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
sha2 = "0.10"
regex = "1.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package.vertex-core]
codegen-units = 16

[profile.release.package.vertex-app]
codegen-units = 16

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vertex Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
infer = "0.16"
mime_guess = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff", "gif"] }
ravif = { version = "0.11", default-features = false }
rgb = "0.8"
window-vibrancy = "0.5"
tauri = { version = "2.2", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "2.0" }
tauri-plugin-opener = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-global-shortcut = "2.2"
sha2 = "0.10"
regex = "1.11"

[package]
name = "vertex-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
infer.workspace = true
image.workspace = true
ravif.workspace = true
rgb.workspace = true
sha2.workspace = true
regex.workspace = true
quick-xml = "0.42"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
csv = "1.4"
serde_yaml_ng = "0.10"
toml = "0.9"
tar = "0.4"
flate2 = "1.1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
resvg = "0.48"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
same-file = "1.0"
fast_image_resize = { version = "6.1", features = ["image", "rayon"] }

tempfile = "3.16"

[dependencies.url]
version = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
